[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concordia-protocol"
version = "0.10.0"
description = "Reference implementation of the Concordia Protocol — structured negotiation between autonomous agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Erik Newton", email = "eriknewton@gmail.com" },
]
keywords = ["negotiation", "agents", "protocol", "ai", "commerce", "a2a", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=42.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
server = [
    # Upper-capped at <2: mcp 2.0.0 removed `mcp.server.fastmcp` (the FastMCP
    # entry point `concordia/mcp_server.py` imports) in favour of
    # `mcp.server.mcpserver`. The floor-only pin resolved to 2.0.0 and broke
    # every CI job on every branch. This cap is a HOLD, not a decision to stay
    # on 1.x: migrating to the mcp 2.x server API is its own change.
    "mcp>=1.0,<2",
]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "mcp>=1.0,<2",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pynacl>=1.5",
    "rfc8785>=0.1.4",
    "ruff>=0.6",
    # Type stubs for the `jsonschema` runtime dependency so `mypy concordia`
    # type-checks the schema-validation modules instead of treating the import
    # as untyped.
    "types-jsonschema>=4.20",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/eriknewton/concordia-protocol"
Repository = "https://github.com/eriknewton/concordia-protocol"
Documentation = "https://github.com/eriknewton/concordia-protocol/blob/main/SPEC.md"
Issues = "https://github.com/eriknewton/concordia-protocol/issues"

[project.scripts]
concordia-mcp-server = "concordia.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["concordia"]
# Ship the JSON schemas INSIDE the package (concordia/schemas) so schema-backed
# validators work in an installed wheel. Without this, schemas/ lived only at
# the repo root and every pip user hit FileNotFoundError. See
# concordia/schema_validator.py for the packaged-or-repo-root resolution.
force-include = { "concordia/py.typed" = "concordia/py.typed", "schemas" = "concordia/schemas" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end multi-agent integration tests",
]

[tool.ruff]
# Lint-only adoption (no `ruff format` this pass — whole-tree reformatting would
# be a giant unreviewable diff). target-version tracks requires-python = ">=3.10".
target-version = "py310"
# Generous to match the existing code; E501 (line-too-long) is disabled below so
# this only bounds the few rules that respect it. Reformatting is a future option.
line-length = 100

[tool.ruff.lint]
# Pyflakes (F), a curated pycodestyle subset (E), and import sorting (I).
select = ["E", "F", "I"]
ignore = [
    # Line length is intentionally not enforced as a lint gate: the tree has many
    # long lines and we are NOT running `ruff format` this pass. Revisit with a
    # dedicated formatting wave.
    "E501",
    # Ambiguous-variable-name and module-import-position are noisy against the
    # existing style without changing behavior; out of scope for this pass.
    "E741",
    "E402",
]

[tool.ruff.lint.isort]
known-first-party = ["concordia"]

[tool.mypy]
# Type-checks the shipped package (`mypy concordia`). The gate is honest: the
# tree passes with these flags and zero blanket per-module `ignore_errors`.
# `disallow_untyped_defs`/full `--strict` are intentionally NOT enabled here —
# turning them on surfaces a large body of legacy untyped-def churn that is a
# future hardening wave, not this one. The flags below are the strict-adjacent
# subset the codebase already satisfies, so regressions (a new None deref, a
# silent str/int equality bug, a stale `type: ignore`) fail CI.
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
# `warn_unreachable` is deliberately off: this protocol library keeps defensive
# `isinstance` guards against malformed external JSON whose static type says the
# branch is unreachable (e.g. concordia/cmpc/revocation.py). Those guards are
# correct runtime behavior, not dead code.
