name: Publish JS SDK to npm (manual)

# MANUAL ONLY. This workflow never fires on a push or a tag; it runs solely when
# a maintainer triggers it from the Actions tab (workflow_dispatch). That keeps
# publishing a deliberate, reviewed act rather than an automatic side effect of
# a merge or tag.
#
# Authentication: npm Trusted Publishing (OIDC). No static NPM_TOKEN secret.
# The GitHub Actions OIDC token is exchanged for a short-lived npm publish
# token at publish time; the trusted-publisher link is configured at
# npmjs.com/package/@concordia-protocol/sdk/access naming this repository and
# this workflow filename. Provenance (a signed SLSA build-provenance
# attestation) is attached automatically under trusted publishing, so no
# --provenance flag is passed. Both require `id-token: write` and a public
# GitHub-hosted runner. This mirrors the proven sanctuary-framework
# publish-on-tag.yml pattern.
#
# npm 11+ is required for trusted publishing, which is why this pins Node 24
# (Node 20 ships npm 10 and cannot exchange the OIDC token).
#
# Before publishing, the same gate the CI runs (install -> typecheck -> lint ->
# format -> test -> test-floor -> build) must pass, so a broken build cannot be
# published.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under (e.g. alpha, latest)'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing (OIDC) + provenance.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      # setup-node MUST be v5+ for trusted publishing. v4 sets NODE_AUTH_TOKEN
      # to its literal placeholder (XXXXX-XXXXX-XXXXX-XXXXX) and writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into the generated
      # .npmrc, so npm sends that placeholder as its credential and never
      # attempts the OIDC exchange. The registry answers 404 on the PUT.
      # Observed on run 30732171360 (2026-08-02). sanctuary-framework's proven
      # publish workflow uses v7; this matches it.
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (resolved 2026-08-02)
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: js-sdk
        run: npm ci

      - name: Typecheck
        working-directory: js-sdk
        run: npm run typecheck

      - name: Lint (eslint)
        working-directory: js-sdk
        run: npm run lint

      - name: Format check (prettier)
        working-directory: js-sdk
        run: npm run format:check

      - name: Test
        working-directory: js-sdk
        run: npm test

      - name: Test-count floor
        working-directory: js-sdk
        run: node scripts/test-floor.mjs

      - name: Build
        working-directory: js-sdk
        run: npm run build

      - name: Publish (trusted publishing)
        working-directory: js-sdk
        # Trusted publishing supplies the credential and attaches provenance
        # automatically; no --provenance flag and no NODE_AUTH_TOKEN.
        # --access public is required for a scoped package's first publish and
        # is harmless thereafter. The dist-tag comes from the manual input.
        run: npm publish --access public --tag "${{ github.event.inputs.tag }}"
