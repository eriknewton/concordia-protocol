name: Vocab Guard

# House-style vocabulary guards for public artifacts. Runs three checks via
# scripts/vocab-guard.sh:
#   (a) no em-dash / en-dash in the curated public Markdown set
#   (b) no CIMC author/creator credit (only the attribution-rule line is allowed)
#   (c) no retired L1/L2/L3/L4 layer numbering in the agent-facing surface
# See scripts/vocab-guard.sh for the exact scope and rationale of each check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vocab-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2 (resolved 2026-05-18)

      - name: Run vocabulary guards
        run: bash scripts/vocab-guard.sh
