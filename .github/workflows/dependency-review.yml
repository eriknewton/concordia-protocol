name: Dependency Review

# Scans dependency manifest changes on every PR for known-vulnerable or
# disallowed-license dependencies before they merge. Free on public repos.
# Runs on pull_request only: the action diffs the PR's dependency graph
# against the base branch, which has no meaning on a direct push.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2 (resolved 2026-05-18)

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.0 (resolved 2026-06-16)
        with:
          # Fail the PR on high-or-worse advisories; surface a summary comment.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
