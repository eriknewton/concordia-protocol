name: js-sdk-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js-sdk-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2 (resolved 2026-05-18)
        with:
          fetch-depth: 0

      - name: Detect JS SDK changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.base_ref }}"
            git fetch --no-tags --prune --depth=1 origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
            if ! changed_files="$(git diff --name-only "origin/${base_ref}...HEAD")"; then
              echo "Could not compute pull_request diff; running js-sdk gate."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            before="${{ github.event.before }}"
            if [[ -n "${before}" && "${before}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              if ! changed_files="$(git diff --name-only "${before}...HEAD")"; then
                echo "Could not compute push diff; running js-sdk gate."
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Could not compute push diff; running js-sdk gate."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if printf '%s\n' "${changed_files}" | grep -q '^js-sdk/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip JS SDK gate
        if: steps.detect.outputs.changed != 'true'
        run: echo "js-sdk untouched; gate passes vacuously"

      - name: Set up Node.js ${{ matrix.node-version }}
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4.4.0 (resolved 2026-05-18)
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: js-sdk/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        working-directory: js-sdk
        run: npm ci

      - name: Typecheck
        if: steps.detect.outputs.changed == 'true'
        working-directory: js-sdk
        run: npm run typecheck

      - name: Lint (eslint)
        if: steps.detect.outputs.changed == 'true'
        working-directory: js-sdk
        run: npm run lint

      - name: Format check (prettier)
        if: steps.detect.outputs.changed == 'true'
        working-directory: js-sdk
        run: npm run format:check

      - name: Test
        if: steps.detect.outputs.changed == 'true'
        working-directory: js-sdk
        run: npm test

      - name: Test-count floor
        if: steps.detect.outputs.changed == 'true'
        working-directory: js-sdk
        run: node scripts/test-floor.mjs

      - name: Build
        if: steps.detect.outputs.changed == 'true'
        working-directory: js-sdk
        run: npm run build
