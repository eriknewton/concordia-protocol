name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# A tag must pass the SAME gates as a push to main before it can publish.
# These jobs mirror ci.yml so a tag on a red or version-incoherent tree can
# never reach the PyPI upload step. OIDC trusted publishing protects the token;
# these gates protect artifact quality. The publish job below `needs:` them.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 20
        # Required by tests/test_js_predicate_parity.py and the DELTA-20
        # shell-to-node parity tests in tests/test_canonicalization_vectors.py.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4.4.0 (resolved 2026-05-18)
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Test-count floor (no silent coverage loss)
        run: bash scripts/test-floor.sh

  version-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Assert version coherence across Python publish surfaces
        run: python scripts/version-coherence.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check concordia

      - name: Mypy type check
        run: mypy concordia

  publish:
    # Gate: only run after the test, version-coherence, and lint jobs pass.
    # A tag on a red or version-incoherent tree cannot publish.
    needs: [test, version-coherence, lint]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted publisher (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1 HEAD at 2026-05-18 (review quarterly)
