name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# A tag must pass the SAME gates as a push to main before it can publish.
# These jobs mirror ci.yml so a tag on a red or version-incoherent tree can
# never reach the PyPI upload step. OIDC trusted publishing protects the token;
# these gates protect artifact quality. The publish job below `needs:` them.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 20
        # Required by tests/test_js_predicate_parity.py and the DELTA-20
        # shell-to-node parity tests in tests/test_canonicalization_vectors.py.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v4.4.0 (resolved 2026-05-18)
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install JS conformance runner dependencies
        run: npm ci --prefix conformance/reference-runner-js

      - name: Audit dependencies for CVEs
        # Same command + suppression as ci.yml (CVE-2026-4539: dev-only
        # transitive pygments ReDoS, no fix version; rationale in ci.yml).
        run: pip install pip-audit && pip-audit --requirement requirements.lock --ignore-vuln CVE-2026-4539

      - name: Run tests
        run: pytest -v

      - name: Test-count floor (no silent coverage loss)
        run: bash scripts/test-floor.sh

  onboarding-smoke:
    # Public-surface guard: a plain, non-editable install must be enough for a
    # fresh adopter to sign, verify, emit an attestation, and inspect MCP tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Install Concordia as an adopter would
        run: pip install '.[server]'

      - name: Run onboarding smoke
        run: python scripts/onboarding_smoke.py

  version-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Assert version coherence across Python publish surfaces
        run: python scripts/version-coherence.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check concordia

      - name: Mypy type check
        run: mypy concordia

  publish:
    # Gate: only run after the test, onboarding-smoke, version-coherence, and lint jobs pass.
    # A tag on a red or version-incoherent tree cannot publish.
    needs: [test, onboarding-smoke, version-coherence, lint]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted publisher (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1 HEAD at 2026-05-18 (review quarterly)
