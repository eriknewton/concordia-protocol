name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 20
        # Required by tests/test_js_predicate_parity.py and the DELTA-20
        # shell-to-node parity tests in tests/test_canonicalization_vectors.py.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v4.4.0 (resolved 2026-05-18)
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install JS conformance runner dependencies
        run: npm ci --prefix conformance/reference-runner-js

      - name: Audit dependencies for CVEs
        # Suppression rationale (self-contained; reviewed 2026-06-16):
        #   CVE-2026-4539 (pygments, low-severity ReDoS in the AdlLexer GUID regex)
        #   is a transitive dev-only dependency with no upstream fix version
        #   available at suppression time. Advisory:
        #   https://github.com/advisories/GHSA-5239-wwwm-4pmq
        #   Re-evaluate and drop this --ignore-vuln once a patched pygments is pinned.
        run: pip install pip-audit && pip-audit --requirement requirements.lock --ignore-vuln CVE-2026-4539

      - name: Run tests
        run: pytest -v

      - name: Test-count floor (no silent coverage loss)
        # Hard-fail gate: fails if the collected pytest count drops below the
        # integer in .test-baseline. Catches silently-deleted tests.
        run: bash scripts/test-floor.sh

  onboarding-smoke:
    # Public-surface guard: a plain, non-editable install must be enough for a
    # fresh adopter to sign, verify, emit an attestation, and inspect MCP tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Install Concordia as an adopter would
        run: pip install '.[server]'

      - name: Run onboarding smoke
        run: python scripts/onboarding_smoke.py

  version-coherence:
    # Hard-fail gate: the three Python publish surfaces (pyproject.toml,
    # concordia/__init__.py, server.json) must declare the same version.
    # Deliberately does NOT bind plugin.json or the independently-versioned
    # js-sdk. See scripts/version-coherence.py for scope rationale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Assert version coherence across Python publish surfaces
        run: python scripts/version-coherence.py

  clean-room-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Install clean-room verifier dependencies
        run: pip install rfc8785 pynacl

      - name: Verify interop fixtures without Concordia
        run: python scripts/claims/clean_room_verify.py docs/interop/

  conformance-clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Install conformance runner dependencies
        run: pip install rfc8785 pynacl jsonschema

      - name: Verify conformance vectors without Concordia
        run: python conformance/reference-runner/runner.py conformance/vectors/

  conformance-clean-room-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v4.4.0 (resolved 2026-05-18)
        with:
          node-version: '20'

      - name: Install JS conformance runner dependencies
        run: npm ci --prefix conformance/reference-runner-js

      - name: Verify conformance vectors with Node.js runner
        run: node conformance/reference-runner-js/runner.mjs conformance/vectors/

  executable-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check generated conformance document
        run: python scripts/claims/generate_conformance.py --check

      - name: Run executable claims gate
        run: python scripts/claims/run.py

  lint:
    # Gated code-quality checks for the Python package: ruff (lint) and mypy
    # (type check). Hard-fail — a new lint or type regression blocks the merge.
    # Config lives in pyproject.toml ([tool.ruff], [tool.mypy]).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check concordia

      - name: Mypy type check
        run: mypy concordia

  wheel-install-smoke:
    # Catches the schema-packaging class of bug: the editable install used by
    # the `test` job runs from the source tree, where repo-root schemas/ always
    # exists, so it cannot detect a wheel that ships without its schemas. This
    # job builds the wheel, installs it into a CLEAN venv, and loads schemas
    # from a directory with no repo-root schemas/ on the resolution path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2 (resolved 2026-05-18)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (resolved 2026-05-18)
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel into a clean venv and load schemas from outside the tree
        run: |
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install dist/*.whl
          cd /tmp  # no repo-root schemas/ on the path here
          /tmp/cleanenv/bin/python - <<'PY'
          import concordia.schema_validator as sv
          for fn in (
              "attestation.schema.json", "approval_receipt.schema.json",
              "fulfillment_attestation.schema.json", "receipt_bundle.schema.json",
              "reference.schema.json", "revocation_record.schema.json", "predicate.json",
          ):
              assert isinstance(sv._load_schema(fn), dict), fn
          from concordia.adapters.a2cn import dispute_resolved as dr
          assert isinstance(dr.DISPUTE_RESOLVED_SCHEMA, dict)
          print("wheel-install-smoke PASS:", sv._SCHEMAS_DIR)
          PY
